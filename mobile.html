<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting…</title>
<script>
/* mobile.html has been retired. The main user site (index.html) is now fully
   responsive and serves phones and computers alike, so this page just forwards
   anyone with an old bookmark to index.html, preserving their query string. */
(function () {
  try {
    var qs = location.search || "";
    // Strip any leftover auto-redirect flags so we don't loop or confuse index.
    qs = qs.replace(/[?&](auto|nr)=1/g, "");
    if (qs === "?" ) qs = "";
    if (qs.charAt(0) === "&") qs = "?" + qs.slice(1); // stripping the first param can leave a leading & — restore the ? so index.html?params isn't mangled into a 404
    location.replace("index.html" + qs);
  } catch (e) {
    location.href = "index.html";
  }
})();
</script>
<meta http-equiv="refresh" content="1;url=index.html">
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:#0f2744;color:#fff;display:flex;align-items:center;justify-content:center;
       min-height:100vh;margin:0;text-align:center;padding:20px}
  a{color:#9ec5ff}
</style>
</head>
<body>
  <div>
    <p>Taking you to the vacation scheduler…</p>
    <p><a href="index.html">Tap here if you are not redirected automatically.</a></p>
  </div>
</body>
</html>
