# Static site — three HTML files, no build step.
# Publishing from the repo root means a deploy just copies files up.
[build]
  publish = "."
  command = ""

# Do NOT enable auto-deploy from git in the Netlify dashboard.
# On the free credit plan every production deploy costs 15 credits
# (~20/month). Commits are free; deploys are deliberate.
# Deploy with:  netlify deploy --prod
